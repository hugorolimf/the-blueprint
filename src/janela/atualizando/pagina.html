<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><title>The Blueprint (beta)</title>
<style>
:root{--paper:#0c3a78;--ink:#eaf4ff;--mid:#9cc4ee;--lo:#5b93d0;--faint:#2f66aa;--erro:#ffb4a8;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:12px/1.45 var(--mono);overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
body{border:1px solid var(--ink);padding:20px 24px 16px;display:flex;flex-direction:column;
 background:
  linear-gradient(#ffffff1c 1px,transparent 1px) 0 0/60px 60px,
  linear-gradient(90deg,#ffffff1c 1px,transparent 1px) 0 0/60px 60px,
  linear-gradient(#ffffff0c 1px,transparent 1px) 0 0/12px 12px,
  linear-gradient(90deg,#ffffff0c 1px,transparent 1px) 0 0/12px 12px,
  radial-gradient(ellipse at 50% 30%,#1250a0 0,#0c3a78 62%,#082b5e 100%)}
header{display:flex;align-items:center;gap:12px}
header svg{width:34px;height:34px;flex:none}
.marca{color:var(--mid);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
h1{margin:2px 0 0;font:600 15px/1.2 var(--mono);letter-spacing:.02em}
ol{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:7px}
li{display:flex;align-items:center;gap:10px;color:var(--lo)}
li i{width:12px;height:12px;flex:none;border:1px dashed var(--lo)}
li[data-s=feito]{color:var(--mid)}li[data-s=feito] i{background:var(--ink);border:1px solid var(--ink)}
li[data-s=ativo]{color:var(--ink)}li[data-s=ativo] i{border:1px solid var(--ink);background:#eaf4ff33}
.barra{position:relative;height:4px;margin-top:auto;background:var(--faint);overflow:hidden}
.barra b{position:absolute;inset:0;background:var(--ink);transform:scaleX(.5);transform-origin:left;transition:transform .5s ease}
.barra u{position:absolute;top:0;bottom:0;width:30%;left:-30%;background:linear-gradient(90deg,transparent,#eaf4ffcc,transparent);opacity:0}
body[data-fase=ativa] .barra u{opacity:1;animation:desliza 1.4s ease-in-out infinite}
@keyframes desliza{to{left:100%}}
@media (prefers-reduced-motion:reduce){body[data-fase=ativa] .barra u{animation:none;left:0;width:100%;opacity:.35}.barra b{transition:none}}
footer{margin-top:10px;min-height:32px;color:var(--mid);font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:12px}
footer.erro{color:var(--erro)}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:4px 12px;cursor:pointer}
button:hover,button:focus-visible{background:#ffffff1f;outline:none}
[hidden]{display:none}
</style></head>
<body data-fase="ativa">
<header>
<svg viewBox="0 0 34 34" fill="none" stroke="#eaf4ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h20l5 5v17H5z"/><path d="M25 6v5h5" stroke="#9cc4ee"/><path d="M10 17h14M10 21h14M10 25h8" stroke="#9cc4ee"/><circle cx="10" cy="12" r="1.6"/></svg>
<div><div class="marca">The Blueprint (beta)</div><h1>{{titulo}}</h1></div></header>
<ol id="passos"><li data-s="feito"><i></i>{{p0}}</li><li data-s="feito"><i></i>{{p1}}</li><li data-s="ativo"><i></i>{{p2}}</li><li data-s="espera"><i></i>{{p3}}</li></ol>
<div class="barra"><b id="b"></b><u></u></div>
<footer id="rodape"><span id="nota">{{nota}}</span><button id="fechar" hidden>{{fechar}}</button></footer>
<script>
const passos=document.querySelectorAll("#passos li"),barra=document.getElementById("b"),nota=document.getElementById("nota"),rodape=document.getElementById("rodape"),fechar=document.getElementById("fechar");
const enviar=(m)=>window.ipc&&window.ipc.postMessage(m);
function etapa(n){passos.forEach((li,i)=>li.dataset.s=i<n?"feito":i===n?"ativo":"espera");barra.style.transform="scaleX("+(n*25+25)/100+")";}
function pronto(){passos.forEach((li)=>li.dataset.s="feito");barra.style.transform="scaleX(1)";document.body.dataset.fase="fim";nota.textContent="{{pronto}}";}
function erro(t){document.body.dataset.fase="erro";rodape.classList.add("erro");nota.textContent=t;fechar.hidden=false;fechar.focus();}
fechar.onclick=()=>enviar("fechar");
document.addEventListener("mousedown",(e)=>{if(e.target.tagName!=="BUTTON")enviar("arrastar");});
enviar("pronta");
</script></body></html>
