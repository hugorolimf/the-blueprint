[package]
name = "blueprint-ui"
version = "0.1.0"
edition = "2021"
description = "A interface nativa do The Blueprint (egui): desktop (Windows, Linux) e navegador (WebAssembly) com o mesmo código"
license = "MIT"
publish = false

# Fora do pacote `blueprint` da raiz: o `cargo test` e o CI de lá não compilam a interface nativa (ainda).
[workspace]

[lib]
name = "blueprint_ui"
path = "src/lib.rs"

[[bin]]
name = "blueprint-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
ehttp = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1.1.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# Só no desktop: salvar a captura da janela (`captura.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

# No Linux o eframe precisa dizer quais servidores de janela usa.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }

# No navegador: o canvas da página e o log no console.
[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }

# `trunk --release` usa este perfil: opt-level 2 é tão rápido quanto o 3 e bem menor, que é o que pesa ao baixar o app.
[profile.web]
inherits = "release"
opt-level = 2
lto = "fat"
codegen-units = 1
