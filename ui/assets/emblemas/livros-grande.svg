<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 280" width="390" height="280"><style>.iso-fill{fill:#0c3a78;stroke:none}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:#0a2f63}
.iso-shade[data-shade="1"]{fill:#0c346c}
.iso-shade[data-shade="2"]{fill:#0f3a75}
.iso-shade[data-shade="3"]{fill:#13427f}
.iso-top{fill:#1a5398}
.iso-halo{fill:#03142e;stroke:none;filter:blur(9px);opacity:.45;}
.iso-line{fill:none;stroke:#518ac8;stroke-width:.6px;stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:#eaf4ff}
.iso-line[data-tone="mid"]{stroke:#8dbaea}
.iso-line[data-tone="lo"]{stroke:#518ac8}
.iso-line[data-tone="faint"]{stroke:#2d63a6}
.iso-line[data-tone="lit"]{stroke:#fff;stroke-width:1.6px}
.iso-dots circle{fill:#e6f2ff;stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-face-text{fill:#8dbaea;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-weight:700;letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:#eaf4ff}
.iso-face-text[data-tone="lo"]{fill:#518ac8}
.iso-face-text[data-tone="faint"]{fill:#2d63a6}
.legenda-marca{letter-spacing:.16em}
.fantasma-emb{opacity:.6}
.fantasma-emb .iso-fill,.fantasma-emb .iso-shade,.fantasma-emb .iso-top{fill:none}
.fantasma-emb .iso-line{stroke-dasharray:3 3}
.fantasma-emb .iso-face-text{fill:none;stroke:#8dbaea;stroke-width:.6}
