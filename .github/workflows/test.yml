name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --lib --locked

  # metas de desempenho do projeto com folga para o runner (binário, p95 das rotas, memória e CPU em repouso); limites em referencias/relatorio-medicao.md
  desempenho:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: cargo build --release
        run: cargo build --release --locked
      - name: limites de desempenho
        run: node scripts/medir-rust.mjs target/release/blueprint.exe --limites
      # o caminho do iniciante (banco vazio, exemplo, MCP, proposta aplicada) no Edge do runner; ~10 s
      - name: primeiro uso de ponta a ponta
        run: node scripts/primeiro-uso-e2e.mjs target/release/blueprint.exe

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: kit do anatomy e migração
        run: |
          node emblemas.test.mjs
          node agentes-figura.test.mjs
          node agentes-claude.test.mjs
          node scripts/migrar-vocabulario.test.mjs
          node atualizacao.test.mjs
          node notificacao.test.mjs
          node sincronia.test.mjs
          node operacoes.test.mjs
          node presenca.test.mjs
          node linha-do-tempo.test.mjs
          node terminal-logica.test.mjs
          node scripts/conferir-readmes.mjs
          node scripts/conferir-links.mjs
          node i18n.test.mjs
          node primeiro-uso.test.mjs
          node scripts/i18n-completude.mjs
          node scripts/gerar-roadmap.mjs --conferir

  # Experimental (viabilidade de Linux e macOS, docs/linux-macos.md): compila a janela fora do Windows e só registra os erros.
  # Nunca reprova a execução; o log sobe como artefato.
  janela-fora-do-windows:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK, GTK e a biblioteca da bandeja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: tira o cfg(windows) da janela, só neste job
        shell: bash
        run: |
          printf '\n[target."cfg(not(windows))".dependencies]\ntao = "0.37.1"\ntray-icon = "0.26.1"\nwry = "0.57.0"\n' >> Cargo.toml
          perl -0pi -e 's/#\[cfg\(windows\)\]\npub mod janela;/pub mod janela;/' src/lib.rs
          grep -n 'pub mod janela' src/lib.rs
      - name: cargo check com a janela
        shell: bash
        run: |
          set -o pipefail
          cargo check --bin blueprint --message-format short 2>&1 | tee janela-${{ runner.os }}.log
      - name: erros por arquivo
        if: always()
        shell: bash
        run: grep -oE '^src/[^:]+' janela-${{ runner.os }}.log | sort | uniq -c | sort -rn || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janela-${{ runner.os }}
          path: janela-${{ runner.os }}.log
