name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --lib --locked

  # metas de desempenho do projeto com folga para o runner (binário, p95 das rotas, memória e CPU em repouso); limites em referencias/relatorio-medicao.md
  desempenho:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: cargo build --release
        run: cargo build --release --locked
      - name: limites de desempenho
        run: node scripts/medir-rust.mjs target/release/blueprint.exe --limites
      # o caminho do iniciante (banco vazio, exemplo, MCP, proposta aplicada) no Edge do runner; ~10 s
      - name: primeiro uso de ponta a ponta
        run: node scripts/primeiro-uso-e2e.mjs target/release/blueprint.exe

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: kit do anatomy e migração
        run: |
          node emblemas.test.mjs
          node agentes-figura.test.mjs
          node agentes-claude.test.mjs
          node scripts/migrar-vocabulario.test.mjs
          node atualizacao.test.mjs
          node notificacao.test.mjs
          node sincronia.test.mjs
          node operacoes.test.mjs
          node presenca.test.mjs
          node linha-do-tempo.test.mjs
          node terminal-logica.test.mjs
          node scripts/conferir-readmes.mjs
          node scripts/conferir-links.mjs
          node i18n.test.mjs
          node primeiro-uso.test.mjs
          node scripts/i18n-completude.mjs
          node scripts/gerar-roadmap.mjs --conferir

  # A interface nativa (ui/, egui): regras dos dados, larguras do texto, inglês de cada texto, e a compilação para o navegador (WebAssembly).
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - name: cargo test
        run: cargo test --locked
      - name: cargo check (WebAssembly)
        run: cargo check --locked --target wasm32-unknown-unknown
