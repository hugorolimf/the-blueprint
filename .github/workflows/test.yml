name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --lib --locked

  # metas de desempenho do projeto com folga para o runner (binário, p95 das rotas, memória e CPU em repouso); limites em referencias/relatorio-medicao.md
  desempenho:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: cargo build --release
        run: cargo build --release --locked
      - name: limites de desempenho
        run: node scripts/medir-rust.mjs target/release/blueprint.exe --limites

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: kit do anatomy e migração
        run: |
          node emblemas.test.mjs
          node agentes-figura.test.mjs
          node agentes-claude.test.mjs
          node scripts/migrar-vocabulario.test.mjs
          node atualizacao.test.mjs
          node notificacao.test.mjs
          node sincronia.test.mjs
          node operacoes.test.mjs
          node presenca.test.mjs
          node linha-do-tempo.test.mjs
          node terminal-logica.test.mjs
          node scripts/conferir-readmes.mjs
          node scripts/conferir-links.mjs
          node i18n.test.mjs
          node scripts/i18n-completude.mjs
          node scripts/gerar-roadmap.mjs --conferir
