name: Ideia
description: Sugira uma melhoria ou funcionalidade
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve
    validations:
      required: true
  - type: textarea
    id: ideia
    attributes:
      label: Como você imagina
      description: Lembre que o app não manda trabalho ao agente sozinho; ele mostra e guarda o que o seu agente informa pelo MCP, e só inicia uma sessão quando você clica.
