[package]
name = "blueprint"
version = "0.4.0"
edition = "2021"
description = "The Blueprint (beta): backend em Rust com SQLite, interface web servida por HTTP"
license = "MIT"
repository = "https://github.com/hugorolimf/the-blueprint"
publish = false

[dependencies]
flate2 = "1.1.10"
getrandom = "0.3.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny_http = "0.12.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[target."cfg(unix)".dependencies]
libc = "0.2"

# fora do Windows a janela é a interface nativa (ui/, egui), no mesmo processo do servidor
[target."cfg(not(windows))".dependencies]
blueprint-ui = { path = "ui" }

[target."cfg(windows)".dependencies]
tao = "0.37.1"
tray-icon = "0.26.1"
wry = "0.57.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# No `blueprint dev` a janela é a interface nativa (egui + resvg): sem otimizar as dependências ela fica lenta a ponto de perder cliques.
# Só as dependências são otimizadas; o código do projeto continua compilando rápido e com depuração.
[profile.dev.package."*"]
opt-level = 3
