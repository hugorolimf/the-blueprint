[package]
name = "blueprint"
version = "0.1.4"
edition = "2021"
description = "The Blueprint (beta): backend em Rust com SQLite, interface web servida por HTTP"
license = "MIT"
repository = "https://github.com/hugorolimf/the-blueprint"
publish = false

[dependencies]
flate2 = "1.1.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny_http = "0.12.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[target."cfg(windows)".dependencies]
tao = "0.37.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57.0"
